version: 1
project:
  title: 源代码：原子物理的逆向工程
  authors:
    - name: Jin Lei
      url: https://jinlei.fewbody.com
  github: jinleiphys/atomic
  thebe:
    binder:
      repo: jinleiphys/atomic
      provider: github
      url: https://mybinder.org
      ref: main
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: intro.md
    - title: 前言
      children:
        - file: preface.md
    - title: 第一章 原子的核式结构
      children:
        - file: ch01/intro.md
          children:
            - file: ch01/electron-discovery.md
            - file: ch01/rutherford-scattering.md
            - file: ch01/classical-collapse.md
    - title: 第二章 信息的数字化
      children:
        - file: ch02/intro.md
          children:
            - file: ch02/spectral-data.md
            - file: ch02/bohr-model.md
            - file: ch02/franck-hertz.md
    - title: 第三章 逻辑内核重构
      children:
        - file: ch03/intro.md
          children:
            - file: ch03/wave-particle.md
            - file: ch03/uncertainty.md
            - file: ch03/wavefunction.md
    - title: 第四章 终极算法
      children:
        - file: ch04/intro.md
          children:
            - file: ch04/schrodinger.md
            - file: ch04/operators.md
            - file: ch04/hydrogen.md
    - title: 第五章 元数据与微扰
      children:
        - file: ch05/intro.md
          children:
            - file: ch05/spin.md
            - file: ch05/fine-structure.md
site:
  options:
    logo: logo.png
    folders: true
  template: book-theme
