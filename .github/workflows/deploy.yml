name: Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Install dependencies
        run: |
          pip install jupyter-book ghp-import
          python -c "import matplotlib; import shutil; shutil.rmtree(matplotlib.get_cachedir(), ignore_errors=True)"

      - name: Build Chinese version
        working-directory: book
        env:
          BASE_URL: /atomic
        run: |
          python -m jupyter_book build --html

      - name: Build English version
        working-directory: book/en
        env:
          BASE_URL: /atomic/en
        run: |
          python -m jupyter_book build --html

      - name: Merge builds
        run: |
          mkdir -p book/_build/html/en
          cp -r book/en/_build/html/* book/_build/html/en/

      - name: Deploy to GitHub Pages
        working-directory: book
        run: |
          python -m ghp_import -n -p -f _build/html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
